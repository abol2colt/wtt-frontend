<header
  class="h-[58px] border-b border-[var(--border-main)] pb-[12px] flex items-start justify-between [direction:rtl] shrink-0 transition-colors duration-300"
>
  <div class="flex items-start gap-3">
    <button
      type="button"
      class="mobile-menu-button mt-1 grid size-10 place-items-center rounded-2xl border border-[var(--border-main)] text-[var(--text-soft)] shadow-sm transition hover:text-[var(--text-main)] lg:hidden"
      aria-label="باز کردن منوی اصلی"
      (click)="layout.openMobileSidebar()"
    >
      <svg class="size-5" viewBox="0 0 24 24" fill="none">
        <path d="M4 7H20M4 12H20M4 17H20" stroke="currentColor" stroke-linecap="round" />
      </svg>
    </button>

    <div class="w-[290px] text-right">
      <h1
        class="m-0 text-[25px] leading-[1.1] font-black tracking-[-0.5px] text-[var(--text-main)]"
      >
        {{ layout.currentPage().title }}
      </h1>

      <p class="mt-[6px] text-[12px] leading-[1.4] font-semibold text-[var(--text-soft)]">
        {{ layout.currentPage().subtitle }}
      </p>
    </div>
  </div>

  <div
    class="mt-[4px] flex h-[38px] w-[420px] items-center gap-[8px] rounded-[12px] border border-[rgba(20,48,74,0.1)] bg-white px-[10px] shadow-[inset_0_1px_0_rgba(255,255,255,0.02),0_8px_18px_rgba(0,0,0,0.05)] transition-shadow duration-300 dark:border-[rgba(20,48,74,0.82)] dark:bg-[#03111d] dark:shadow-[inset_0_1px_0_rgba(255,255,255,0.02),0_8px_18px_rgba(0,0,0,0.22)]"
  >
    <svg class="h-5 w-5 text-[var(--text-soft)]" viewBox="0 0 24 24" fill="none">
      <path
        d="M21 21L16.65 16.65M11 19C6.58 19 3 15.42 3 11C3 6.58 6.58 3 11 3C15.42 3 19 6.58 19 11C19 15.42 15.42 19 11 19Z"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

    @if (layout.isSearchPanelOpen()) {
      <select
        class="h-[28px] rounded-lg border border-[var(--border-main)] bg-slate-50 px-2 text-[11px] font-black text-[var(--text-soft)] outline-none dark:bg-[#0f1a29]"
        [value]="layout.searchScope()"
        (change)="layout.setSearchScope($any($event.target).value)"
        aria-label="محدوده جستجو"
      >
        <option value="current_page">همین صفحه</option>
        <option value="entire_app">کل سامانه</option>
      </select>
    }
    <input
      #searchInput
      class="min-w-0 flex-1 border-0 bg-transparent text-[12px] font-semibold text-[var(--text-main)] outline-none placeholder:text-[var(--text-muted)] dark:placeholder:text-[rgba(104,117,135,0.5)]"
      placeholder="جستجو..."
      [value]="layout.searchQuery()"
      (input)="layout.setSearchQuery($any($event.target).value)"
      (keydown.enter)="submitSearch()"
      (focus)="layout.isSearchFocused.set(true)"
      (blur)="layout.isSearchFocused.set(false)"
    />

    @if (layout.searchQuery()) {
      <button
        type="button"
        class="grid h-6 w-6 place-items-center rounded-full text-[15px] font-black text-[var(--text-soft)] hover:bg-slate-100 hover:text-[var(--text-main)] dark:hover:bg-white/10"
        aria-label="پاک کردن جستجو"
        (click)="layout.clearSearch()"
      >
        ×
      </button>
    }

    <kbd
      class="flex h-[22px] min-w-[58px] items-center justify-center rounded-[6px] bg-[#f1f5f9] px-[7px] text-[11px] font-[800] text-[#64748b] [direction:ltr] dark:bg-[#0f1a29] dark:text-[#9aa6ba]"
    >
      Ctrl + K
    </kbd>
  </div>

  <div
    class="mt-[4px] flex h-[36px] w-[130px] items-center justify-end gap-[18px] text-[var(--text-soft)] hover:text-[var(--text-main)] [direction:ltr]"
  >
    <button
      type="button"
      class="relative grid size-[24px] place-items-center hover:text-blue-500 transition-colors"
      [class.text-blue-500]="notificationCount() > 0"
      [attr.aria-label]="
        notificationCount() > 0 ? 'مشاهده اطلاعیه‌های خوانده‌نشده' : 'مشاهده اطلاعیه‌ها'
      "
      (click)="openNotifications()"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
        <path
          d="M18 8A6 6 0 0 0 6 8C6 15 3 17 3 17H21C21 17 18 15 18 8Z"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M13.73 21A2 2 0 0 1 10.27 21"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    <button
      (click)="themeService.toggleTheme()"
      class="grid size-[24px] place-items-center hover:text-yellow-500 transition-colors"
    >
      @if (themeService.isDarkMode()) {
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
          <path
            d="M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79Z"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      } @else {
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="5" stroke="currentColor" />
          <path
            d="M12 1V3M12 21V23M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M1 12H3M21 12H23M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      }
    </button>
  </div>
</header>
